[project]
name = "spreadsheet-tools"
version = "0.2.0"
description = "AI-friendly Excel (.xlsx/.xlsm) CLI tools with cleaned reads and style-aware edits"
readme = "README.md"
authors = [
    { name = "Keiner Alvarado", email = "kjgameplay0000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "toon-format>=1.2.0",
]

[project.scripts]
spreadsheet-tools = "spreadsheet_tools.cli:main"
spreadsheet-tools-mcp = "spreadsheet_tools.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# ValueError is the project error for bad input.
# EXE002: this tree is stored with the executable bit forced on.
# PYI041: int and float are different Excel cell types. Keep both.
ignore = ["TRY004", "EXE002", "PYI041"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
